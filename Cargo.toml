[package]
name = "rsrsbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "macOS menu bar manager for git-rsrs autosync watchers"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"

[dev-dependencies]
git-rsrs = { git = "https://github.com/nicecab/git-rsrs", rev = "73ab676d50a835693c3d99fdfb01887f03750358" }
