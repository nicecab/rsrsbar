[package]
name = "rsrsbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "macOS menu bar manager for git-rsrs autosync watchers"
publish = false

[dependencies]
humantime = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"

[dev-dependencies]
serde_json = "1"
