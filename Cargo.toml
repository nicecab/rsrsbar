[package]
name = "rsrsbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "macOS menu bar manager for git-rsrs autosync watchers"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
